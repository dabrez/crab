# Hardened defaults: read-only root fs, no privileges, dropped caps,
# default seccomp profile, no host network.
services:
  crab:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: crab:local
    env_file: ../.env
    ports:
      - "3000:3000"
    volumes:
      - crab-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    user: "65532:65532" # nonroot in distroless

volumes:
  crab-data:
